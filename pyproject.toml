[project]
name = "preflight402"
version = "0.1.0"
description = "One free call before your agent pays. Health, authenticity, and Sybil-filtered reputation - one verdict, any chain."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "chadander", email = "chadander@gmail.com" }]
keywords = ["x402", "mcp", "agent-payments", "trust-preview", "402", "web3", "stablecoin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "mcp[cli]>=1.28,<2",
]

[project.urls]
Homepage = "https://preflight402.ironshell.io"
Repository = "https://github.com/duskwire/preflight402"
Issues = "https://github.com/duskwire/preflight402/issues"

[project.scripts]
preflight402-mcp = "preflight402.api.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.8",
    "trustme>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight402"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -m "not slow"'
markers = [
    "slow: integration tests that hit live networks (deselected by default; run with -m slow)",
]
filterwarnings = [
    # starlette 1.3 wants the httpx2 package for TestClient; defer that extra
    # dev dependency until starlette drops httpx support outright
    'ignore:Using `httpx` with `starlette.testclient` is deprecated',
]
